name: Release

on:
  workflow_call:
    inputs:
      runtime:
        description: "node or python"
        type: string
        default: node
    secrets:
      token:
        required: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        if: inputs.runtime == 'node'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies (node)
        if: inputs.runtime == 'node'
        run: npm ci

      - name: Release (node)
        if: inputs.runtime == 'node'
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.token }}

      - name: Setup Python
        if: inputs.runtime == 'python'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install python-semantic-release
        if: inputs.runtime == 'python'
        run: pip install python-semantic-release==9.15.2

      - name: Release (python)
        if: inputs.runtime == 'python'
        env:
          GH_TOKEN: ${{ secrets.token }}
        run: |
          set -e
          VERSION=$(semantic-release version --print)
          if [ -z "$VERSION" ]; then
            echo "No release needed."
            exit 0
          fi
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists."
            exit 0
          fi
          semantic-release changelog
          gh release create "$TAG" --title "$TAG" --notes-file CHANGELOG.md --target "$GITHUB_SHA"
